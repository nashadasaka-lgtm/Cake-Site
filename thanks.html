<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thank You · Cakes by Nashada Jones</title>
<meta name="theme-color" content="#2E1E19">
<link rel="icon" href="assets/brand/seal-brown.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@1,500&family=Josefin+Sans:wght@300;400&display=swap">
<style>
  :root { --bg: #2E1E19; --text: #F3E7DA; --muted: #C7B19E; --latte: #CCB395; --deep: #1F1411; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: "Josefin Sans", system-ui, sans-serif; font-weight: 300; text-align: center; }
  main { max-width: 520px; padding: 48px max(20px, env(safe-area-inset-left, 0px)) 48px max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; justify-items: center; }
  img { width: 90px; }
  h1 { margin: 0; font-family: "Italiana", Georgia, serif; font-weight: 400; font-size: clamp(2.4rem, 8vw, 3.4rem); line-height: 1.1; }
  h1 em { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; }
  p { margin: 0; color: var(--muted); line-height: 1.7; }
  a.btn { margin-top: 10px; display: inline-block; padding: 16px 30px; background: var(--latte); color: var(--deep); text-decoration: none; font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <img src="assets/brand/seal-cream.png" alt="">
  <h1>Thank you, your enquiry is <em>sent.</em></h1>
  <p>I'll be in touch soon, usually within 48 hours, with ideas and a quote. Keep an eye on your email, including your junk folder.</p>
  <a class="btn" href="/">Back to the cakes</a>
</main>
</body>
</html>
