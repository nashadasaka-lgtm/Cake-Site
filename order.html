<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Form · Cakes by Nashada Jones</title>
<meta name="description" content="Order a buttercream cake or cupcakes from Cakes by Nashada Jones, London.">
<link rel="icon" href="assets/brand/seal-brown.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Josefin+Sans:wght@300;400;600&display=swap">
<style>
/* Same warm palette as the main site */
:root {
  --cocoa: #F3E7DA; --latte: #CCB395; --cream: #2E1E19; --latte-soft: #3F2A23; --line: #5A4034;
  --white: #FCF8F3; --accent: #CCB395; --muted: #C7B19E;
  --display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --script: "Cormorant Garamond", Georgia, serif;
  --body: "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--cocoa); font-family: var(--body); font-weight: 300; font-size: 17px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 900px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
header { border-bottom: 1px solid var(--line); }
header .wrap { display: flex; justify-content: space-between; align-items: center; height: 72px; max-width: 1120px; }
header img { height: 48px; width: auto; display: block; }
.back { text-decoration: none; font-size: .76rem; letter-spacing: .22em; text-transform: uppercase; }
.back:hover { color: var(--accent); }
.intro { padding-block: clamp(40px, 7vw, 72px) 28px; display: grid; gap: 14px; text-align: center; justify-items: center; }
.eyebrow { font-size: .74rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.1; margin: 0; }
h1 em { font-family: var(--script); font-style: italic; }
.intro p { color: var(--muted); max-width: 52ch; margin: 0; }
.notes { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px; font-size: .9rem; margin-top: 6px; }
.notes span::before { content: "\2726"; color: var(--accent); margin-right: 8px; font-size: .75rem; }
.form-box { background: var(--white); border: 1px solid var(--line); margin-bottom: 24px; }
.form-box iframe { display: block; width: 100%; height: 1900px; border: 0; }
.fallback { text-align: center; font-size: .9rem; color: var(--muted); padding-bottom: 64px; }
footer { background: #1F1411; color: var(--latte); padding-block: 32px calc(32px + env(safe-area-inset-bottom, 0px)); font-size: .85rem; text-align: center; }
footer a { color: var(--latte); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="index.html" aria-label="Cakes by Nashada Jones home"><img src="assets/brand/wordmark-cream.png" alt="Cakes by Nashada Jones"></a>
    <a class="back" href="index.html">&larr; Back to the cakes</a>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <p class="eyebrow">Order form</p>
    <h1>Let's plan your <em>cake.</em></h1>
    <p>Fill in the form below and I'll come back to you with ideas and a quote. Nothing is paid here.</p>
    <div class="notes"><span>About 2 weeks' notice preferred</span><span>50% deposit secures your date</span></div>
  </section>
  <div class="form-box">
    <!-- To change the form, swap the link below for your new JotForm link -->
    <iframe id="jotform" title="Cakes by Nashada Jones order form" src="https://form.jotform.com/njcakeacademy/Cakesbynashadajones" allow="camera; microphone; fullscreen" loading="lazy"></iframe>
  </div>
  <p class="fallback">Form not showing? <a href="https://form.jotform.com/njcakeacademy/Cakesbynashadajones" target="_blank" rel="noopener">Open the order form here</a>.</p>
</main>

<footer>
  <a href="https://www.instagram.com/cakesbynashadajones" target="_blank" rel="noopener">Instagram</a> &middot;
  <a href="mailto:njcakeacademy@outlook.com">njcakeacademy@outlook.com</a>
</footer>
<script>
  // JotForm tells the page how tall the form is, so there's no inner scrolling.
  window.addEventListener("message", (e) => {
    if (typeof e.data !== "string" || !/jotform\.com$/.test(new URL(e.origin).hostname)) return;
    const parts = e.data.split(":");
    if (parts[0] === "setHeight" && +parts[1] > 300) document.getElementById("jotform").style.height = (+parts[1] + 40) + "px";
  });
</script>
</body>
</html>
